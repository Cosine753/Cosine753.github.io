<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>个人学术主页 · 建设中</title>
<meta name="description" content="个人学术主页,正在建设中。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%230f5e63'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1f2933;
    --ink-2: #52606d;
    --accent: #0f5e63;
    --hairline: #e4e7eb;
    --bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e5e9ec;
      --ink-2: #a7b0b8;
      --accent: #7fc4c9;
      --hairline: #2b3339;
      --bg: #14181b;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 16px;
    line-height: 1.8;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    align-items: center;
    min-height: 100vh;
  }
  .wrap { max-width: 34rem; margin: 0 auto; padding: 3rem 1.5rem; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.02em; }
  p { margin-top: 1rem; color: var(--ink-2); }
  .rule { margin: 1.75rem 0; border: 0; border-top: 1px solid var(--hairline); }
  .note { font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>个人学术主页</h1>
  <p>本页正在重建中,内容稍后更新。</p>
  <hr class="rule">
  <p class="note">研究方向:眼科临床研究 · 视网膜影像与临床数据质量 · 临床证据的可复现性审计</p>
</div>
</body>
</html>
