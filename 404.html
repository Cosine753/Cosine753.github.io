<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>页面不存在 — 404</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f5e63'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%23ffffff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1a2429; --ink-2: #4a5761; --accent: #0f5e63;
    --accent-dim: #a8c3c5; --hairline: #e2e6e8; --bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e6eaec; --ink-2: #aab5bd; --accent: #7ec8cd;
      --accent-dim: #4a7276; --hairline: #2a3237; --bg: #14181b;
    }
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 16px; line-height: 1.85; color: var(--ink); background: var(--bg);
    display: flex; align-items: center; min-height: 100vh;
  }
  .wrap { max-width: 34rem; margin: 0 auto; padding: 3rem 1.5rem; }
  .code {
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem;
  }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.03em; }
  p { margin-top: 1rem; color: var(--ink-2); }
  hr { margin: 1.75rem 0; border: 0; border-top: 1px solid var(--hairline); }
  a {
    color: var(--accent); text-decoration: underline;
    text-decoration-color: var(--accent-dim); text-underline-offset: 3px;
  }
  a:hover { text-decoration-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="code">Error 404</p>
  <h1>这个页面不存在</h1>
  <p>链接可能已经失效，或者地址输错了。</p>
  <hr>
  <p><a href="/">返回首页</a></p>
</div>
</body>
</html>
